# IMPORTANT: Replace placeholder values with actual secrets before deploying.
# In production, use a secrets manager (AWS Secrets Manager, Vault, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: lifelens-secret
  namespace: lifelens
type: Opaque
stringData:
  database_url: "postgresql://lifelens:SECURE_PASSWORD@postgres-service:5432/lifelens_db"
  redis_url: "redis://:SECURE_PASSWORD@redis-service:6379/0"
  api_key: "SECURE_API_KEY_HERE"
