apiVersion: v1
kind: ServiceAccount
metadata:
  name: lifelens-api
  namespace: lifelens
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifelens-api
  namespace: lifelens
  labels:
    app: lifelens-api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lifelens-api
  template:
    metadata:
      labels:
        app: lifelens-api
        version: v1
    spec:
      serviceAccountName: lifelens-api
      containers:
      - name: lifelens-api
        image: lifelens/api:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: lifelens-secret
              key: database_url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: lifelens-secret
              key: redis_url
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: lifelens-config
              key: environment
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: lifelens-config
              key: log_level
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: lifelens-api-service
  namespace: lifelens
  labels:
    app: lifelens-api
spec:
  type: LoadBalancer
  selector:
    app: lifelens-api
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lifelens-api-hpa
  namespace: lifelens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lifelens-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lifelens-api-policy
  namespace: lifelens
spec:
  podSelector:
    matchLabels:
      app: lifelens-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
